services:
  - type: web
    name: grodel-backend
    env: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below has no safe default — set the real value in the
      # Render dashboard (sync: false keeps secrets out of this file).
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL
        sync: false
      - key: PASS
        sync: false
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
